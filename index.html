<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#09090b">
<title>Guess the Emoji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090b;
    --bg-glow: #131318;
    --surface: #111114;
    --tile: #1a1a1f;
    --tile-hover: #24242b;
    --border: rgba(255, 255, 255, 0.06);
    --border-strong: rgba(255, 255, 255, 0.11);
    --text: #ececf1;
    --muted: #8a8a96;
    --dim: #5c5c66;
    --accent: #e8a33d;
    --accent-hover: #f0b458;
    --accent-ink: #120c03;
    --accent-soft: rgba(232, 163, 61, 0.14);
    --accent-disabled: rgba(232, 163, 61, 0.16);
    --accent-disabled-ink: rgba(236, 236, 241, 0.32);
    --yes: #4ade80;
    --no: #f87171;
    --maybe: #fbbf24;
    --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: radial-gradient(1100px 620px at 50% -12%, var(--bg-glow), var(--bg) 70%) fixed, var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .emoji { font-family: var(--font-emoji); font-weight: 400; line-height: 1; }
  kbd {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    background: var(--tile);
    border: 1px solid var(--border-strong);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 0 5px;
  }
  [hidden] { display: none !important; }

  /* ---------- Game shell ---------- */
  .game {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .bar h1 { margin: 0; font-size: 18px; font-weight: 900; letter-spacing: -0.035em; }
  .bar h1 span { color: var(--accent); }
  .meta { display: flex; align-items: center; gap: 8px; }
  .pill {
    font-size: 12px; font-weight: 500; color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 10px;
    white-space: nowrap;
  }
  .pill b { font-family: var(--font-mono); color: var(--text); font-weight: 700; }
  .pill.over b { color: var(--no); }

  /* ---------- Difficulty slider ---------- */
  .difficulty { display: flex; flex-direction: column; gap: 6px; margin-top: -4px; }
  .diff-top { display: flex; align-items: baseline; justify-content: space-between; font-size: 12px; color: var(--muted); font-weight: 500; }
  .diff-top b { color: var(--text); font-weight: 800; }
  .diff-meta { font-family: var(--font-mono); font-size: 11px; color: var(--dim); }
  .range {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 22px;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }
  .range::-webkit-slider-runnable-track {
    height: 6px; border-radius: 999px;
    background: linear-gradient(to right, var(--accent) var(--fill, 33%), var(--tile) var(--fill, 33%));
  }
  .range::-moz-range-track { height: 6px; border-radius: 999px; background: var(--tile); }
  .range::-moz-range-progress { height: 6px; border-radius: 999px; background: var(--accent); }
  .range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; margin-top: -6px;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 0 0 4px rgba(232, 163, 61, 0.35);
  }
  .range::-moz-range-thumb {
    width: 18px; height: 18px; border: 0;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 0 0 4px rgba(232, 163, 61, 0.35);
  }
  .range:focus-visible { outline: none; }
  .range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--accent); }
  .diff-labels { position: relative; height: 16px; margin: 0 9px; }
  .diff-labels button {
    position: absolute; top: 0;
    transform: translateX(-50%);
    font-size: 11.5px; font-weight: 600;
    color: var(--dim);
    white-space: nowrap;
    transition: color .15s;
  }
  .diff-labels button:first-child { transform: translateX(-9px); }
  .diff-labels button:last-child { transform: translateX(calc(-100% + 9px)); }
  .diff-labels button:hover { color: var(--muted); }
  .diff-labels button.on { color: var(--accent); }
  .link {
    color: var(--accent); font-weight: 700; font-size: 13px;
    text-decoration: underline; text-underline-offset: 2px;
    margin-left: 8px;
  }
  .link.quiet { color: var(--muted); }

  /* ---------- Emoji cloud ---------- */
  .cloud { position: relative; width: 100%; height: 220px; }
  .float {
    position: absolute;
    transform: translate(-50%, -50%) scale(1);
    transition: opacity .5s ease, transform .5s cubic-bezier(.2, 1, .3, 1);
    opacity: var(--o, .4);
    padding: 6px;
    border-radius: 12px;
    z-index: 1;
  }
  .float:hover, .float:focus-visible { opacity: 1; transform: translate(-50%, -50%) scale(1.25); z-index: 3; }
  .float::after {
    content: attr(data-name);
    position: absolute;
    left: 50%; top: 100%;
    transform: translateX(-50%);
    font: 700 11px var(--font-sans);
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    padding: 2px 6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
  }
  .float:hover::after, .float:focus-visible::after { opacity: 1; }
  .float.enter { opacity: 0; transform: translate(-50%, -50%) scale(.3); pointer-events: none; }
  .float.out { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(-25deg); pointer-events: none; }
  .float .emoji {
    display: block;
    font-size: var(--s, 30px);
    filter: saturate(.75);
    animation: bob var(--d, 4s) ease-in-out var(--delay, 0s) infinite alternate;
  }
  .float:hover .emoji { filter: none; }
  .mystery-wrap {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
  }
  .mystery {
    position: relative;
    width: 100px; height: 100px;
    border-radius: 26px;
    background: var(--tile);
    box-shadow: inset 0 0 0 1px var(--border-strong), 0 20px 50px -18px rgba(0, 0, 0, 0.95);
    display: grid; place-items: center;
    overflow: hidden;
  }
  .mystery::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.06) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: shimmer 3.4s ease-in-out infinite;
    pointer-events: none;
  }
  .mystery .q { font-size: 48px; font-weight: 900; color: #34343c; }
  .mystery .emoji { font-size: 58px; animation: pop .55s cubic-bezier(.2, 1.4, .4, 1); }
  .mystery.win { box-shadow: inset 0 0 0 2px var(--accent), 0 0 60px -10px rgba(232, 163, 61, 0.5); }
  .mystery.over { box-shadow: inset 0 0 0 2px var(--muted), 0 0 50px -16px rgba(236, 236, 241, 0.25); }
  .mystery.win::after, .mystery.over::after { display: none; }
  .mystery.shake { animation: shake .42s ease; }

  .left { margin: -6px 0 0; text-align: center; font-size: 14px; font-weight: 600; color: var(--text); }
  .left.over { color: var(--no); }
  .left.done { color: var(--muted); font-weight: 500; }
  .left b { color: var(--text); font-weight: 800; }
  .left .gold { color: var(--accent); }

  /* ---------- Log ---------- */
  .log {
    display: flex; flex-direction: column; gap: 2px;
    max-height: 230px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #2a2a31 transparent;
  }
  .log:empty { display: none; }
  .row {
    display: grid;
    grid-template-columns: 20px auto 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 14px;
  }
  .row:nth-child(odd) { background: rgba(255, 255, 255, 0.022); }
  .row.fresh { animation: rowIn .22s ease, fresh 1.4s ease; }
  .row.past-par .num { color: var(--no); }
  .num { font-family: var(--font-mono); font-size: 11.5px; color: var(--dim); text-align: right; }
  .chip {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 6px;
    white-space: nowrap;
  }
  .chip.guess { color: var(--accent); }
  .text { font-weight: 600; overflow-wrap: anywhere; }
  .text .emoji { margin-right: 6px; font-size: 15px; }
  .ans { font-weight: 800; font-size: 13px; white-space: nowrap; }
  .ans.yes { color: var(--yes); }
  .ans.no { color: var(--no); }
  .ans.maybe { color: var(--maybe); }
  .par-line {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 10px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--no);
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .par-line::before, .par-line::after { content: ""; flex: 1; height: 1px; background: rgba(248, 113, 113, 0.25); }

  /* ---------- Input ---------- */
  .field { position: relative; }
  .input-box {
    display: flex; align-items: center; gap: 10px;
    height: 56px;
    padding: 0 8px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    transition: border-color .15s, box-shadow .15s;
  }
  .input-box:focus-within { border-color: rgba(232, 163, 61, 0.5); box-shadow: 0 0 0 3px rgba(232, 163, 61, 0.1); }
  .mode {
    font-family: var(--font-mono);
    font-size: 13px; font-weight: 700;
    padding: 7px 10px;
    border-radius: 10px;
    background: var(--tile);
    color: var(--muted);
    white-space: nowrap;
    min-width: 70px;
    text-align: center;
    transition: background .15s, color .15s;
  }
  .mode[data-mode="guess"] { color: var(--accent); background: var(--accent-soft); }
  .mode[data-mode="idle"] { color: var(--dim); }
  .input-box input {
    flex: 1; min-width: 0; height: 100%;
    background: transparent; border: 0; outline: 0;
    color: var(--text);
    font: 600 16px var(--font-sans);
  }
  .input-box input::placeholder { color: var(--dim); font-weight: 500; }
  .send {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: grid; place-items: center;
    background: var(--accent);
    color: var(--accent-ink);
    flex: none;
    transition: background .15s, opacity .15s, transform .08s;
  }
  .send:hover:not(:disabled) { background: var(--accent-hover); }
  .send:active:not(:disabled) { transform: scale(.94); }
  .send:disabled { background: var(--accent-disabled); color: var(--accent-disabled-ink); }
  .send svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  .suggest {
    position: absolute;
    left: 0; right: 0; bottom: calc(100% + 8px);
    display: flex; flex-direction: column; gap: 2px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    z-index: 5;
  }
  .suggest-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--dim); font-weight: 600;
    padding: 6px 10px 2px;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .suggest-note { font-size: 12px; color: var(--muted); padding: 8px 10px; font-weight: 500; }
  .suggest-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 9px 12px;
    border-radius: 10px;
    text-align: left;
    font-size: 14.5px; font-weight: 600;
  }
  .suggest-item:hover, .suggest-item[aria-selected="true"] { background: var(--tile); }
  .suggest-item[aria-selected="true"] { box-shadow: inset 2px 0 0 var(--accent); }
  .suggest-item small { color: var(--dim); font-size: 12px; font-weight: 500; white-space: nowrap; }
  .suggest-item .opt { display: flex; align-items: center; gap: 10px; }
  .suggest-item .opt .emoji { font-size: 20px; }
  .suggest-item.tried { opacity: .45; }
  .suggest-item.tried small { color: var(--no); }

  .message { min-height: 18px; margin: -6px 0 -4px; font-size: 13px; color: var(--muted); text-align: center; font-weight: 500; }

  /* ---------- Buttons ---------- */
  .actions { display: flex; gap: 10px; }
  .btn {
    flex: 1 1 0;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 46px;
    padding: 0 14px;
    border-radius: 999px;
    background: var(--tile);
    font-size: 15px; font-weight: 700; letter-spacing: -0.01em;
    white-space: nowrap;
    transition: background .15s, transform .08s, color .15s;
  }
  .btn:hover:not(:disabled) { background: var(--tile-hover); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .4; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn.confirm { color: var(--no); box-shadow: inset 0 0 0 1px rgba(248, 113, 113, 0.4); }
  .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .btn kbd { background: rgba(0, 0, 0, 0.15); border-color: rgba(0, 0, 0, 0.2); color: inherit; }

  /* ---------- Question bank ---------- */
  .bank { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .bank:empty { display: none; }
  .tile {
    position: relative;
    min-height: 62px;
    padding: 16px 14px 12px;
    border-radius: 12px;
    background: var(--tile);
    box-shadow: inset 0 0 0 1px var(--border);
    font-size: 13.5px; font-weight: 700;
    line-height: 1.25;
    text-align: center;
    transition: background .15s, transform .12s, box-shadow .15s;
  }
  .tile:hover { background: var(--tile-hover); transform: translateY(-2px); box-shadow: inset 0 0 0 1px var(--border-strong); }
  .tile:active { transform: scale(.97); }
  .tile .key {
    position: absolute; top: 4px; left: 7px;
    font-family: var(--font-mono); font-size: 10px; font-weight: 700;
    color: var(--dim);
  }
  .tips { margin: -4px 0 0; text-align: center; font-size: 11.5px; color: var(--dim); line-height: 1.8; }

  @media (hover: none) {
    .tile .key, .tips .keys-only { display: none; }
  }

  /* ---------- Emoji shower ---------- */
  .shower {
    position: fixed;
    top: 0;
    z-index: 0;
    pointer-events: none;
    font-family: var(--font-emoji);
    line-height: 1;
    opacity: 0;
    will-change: transform, opacity;
    animation: showerFall var(--dur, 3.4s) cubic-bezier(.35, .1, .55, 1) forwards;
  }
  .shower.burst { z-index: 10; }

  @keyframes showerFall {
    0% { opacity: 0; transform: translate3d(0, -40px, 0) rotate(0deg); }
    12% { opacity: var(--o, .6); }
    80% { opacity: var(--o, .6); }
    100% { opacity: 0; transform: translate3d(var(--drift, 0px), calc(100vh + 40px), 0) rotate(var(--rot, 90deg)); }
  }
  @keyframes bob { from { transform: translateY(-4px) rotate(-4deg); } to { transform: translateY(4px) rotate(4deg); } }
  @keyframes shimmer { 0%, 30% { transform: translateX(-100%); } 70%, 100% { transform: translateX(100%); } }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
  }
  @keyframes rowIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes fresh { from { background: rgba(232, 163, 61, 0.16); } to { background: transparent; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    .shower { display: none; }
  }

  @media (max-width: 480px) {
    body { place-items: start center; padding-top: 18px; }
    .cloud { height: 196px; }
    .mystery { width: 88px; height: 88px; border-radius: 22px; }
    .mystery .emoji { font-size: 50px; }
    .bank { grid-template-columns: repeat(2, 1fr); }
    .row { grid-template-columns: 16px auto 1fr auto; gap: 8px; padding: 7px 8px; font-size: 13.5px; }
    .log { max-height: 190px; }
    .btn { font-size: 14px; padding: 0 10px; }
    .mode { min-width: 0; }
    .pill.best { display: none; }
  }
</style>
</head>
<body>

<main class="game">
  <div class="bar">
    <h1>Guess the <span>Emoji</span></h1>
    <div class="meta">
      <span class="pill best" id="bestPill" hidden>Best <b id="best">0</b></span>
      <span class="pill" id="stepPill">Step <b id="steps">0</b> / <b id="par">15</b></span>
    </div>
  </div>

  <div class="difficulty" role="group" aria-label="Difficulty">
    <div class="diff-top">
      <span>Difficulty · <b id="diffName">Medium</b></span>
      <span class="diff-meta" id="diffMeta"></span>
    </div>
    <input class="range" id="diff" type="range" min="1" max="4" step="1" value="2" aria-label="Difficulty">
    <div class="diff-labels" id="diffLabels">
      <button type="button" data-d="1" style="left:0%">Easy</button>
      <button type="button" data-d="2" style="left:33.333%">Medium</button>
      <button type="button" data-d="3" style="left:66.667%">Hard</button>
      <button type="button" data-d="4" style="left:100%">Expert</button>
    </div>
  </div>

  <section>
    <div class="cloud" id="cloud">
      <div class="mystery-wrap">
        <div class="mystery" id="mystery" aria-live="polite"><span class="q">?</span></div>
      </div>
    </div>
    <p class="left" id="left">15 left</p>
  </section>

  <div class="log" id="log" aria-live="polite"></div>

  <div class="field" id="field">
    <div class="suggest" id="suggest" role="listbox" hidden></div>
    <div class="input-box">
      <span class="mode" id="modeChip" data-mode="idle" aria-hidden="true">ask()</span>
      <input id="input" type="text" enterkeyhint="send" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80" placeholder="Ask a question or type an emoji name…" aria-label="Question or emoji name">
      <button class="send" id="sendBtn" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <p class="message" id="message" aria-live="polite"></p>

  <div class="bank" id="bank"></div>

  <div class="actions" id="actions">
    <button class="btn" id="shuffleBtn">
      <svg viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
      New questions
    </button>
    <button class="btn" id="giveUpBtn">
      <svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
      <span id="giveUpLabel">Give up</span>
    </button>
  </div>

  <div class="actions" id="endActions" hidden>
    <button class="btn primary" id="againBtn">Play again <kbd>Enter</kbd></button>
  </div>

  <p class="tips" id="tips">
    <span class="keys-only"><kbd>1</kbd>–<kbd>6</kbd> ask a bank question · <kbd>↑</kbd><kbd>↓</kbd> pick · <kbd>Enter</kbd> send · </span>tap a floating emoji to guess it
  </p>
</main>

<script>
(() => {
  'use strict';

  // Difficulty: which emojis can come up (by level) and the par to beat.

    ["🇿🇲", "Flag: Zambia", "zambia", "flag object country africa green vstripes emblem", "symbol red black orange", 3],

  ];

  /* ---------- Text helpers ---------- */
  const STOP_WORDS = new Set([
    'is', 'it', 'a', 'an', 'the', 'does', 'do', 'did', 'can', 'could', 'would', 'will', 'you', 'your', 'its', 'of',
    'or', 'and', 'be', 'are', 'was', 'this', 'that', 'to', 'for', 'usually', 'mostly', 'something', 'thing',
    'kind', 'type', 'sort', 'really', 'very', 'typically', 'often', 'commonly', 'ever', 'made', 'used', 'with',
    'have', 'has', 'at', 'by', 'mainly', 'generally', 'normally', 'any', 'some', 'there', 'what', 'maybe',
    'mystery', 'emoji', 'probably', 'kinda', 'sorta', 'like', 'one', 'i', 'me', 'my', 'we', 'find', 'found', 'use'
  ]);
  const ARTICLES = new Set(['a', 'an', 'the', 'some']);
  const QUESTION_START = /^(is|does|do|did|can|could|would|will|has|have|are|was|should|might)\b/;

  const words = (str) => String(str)
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[’']/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim()
    .split(' ')
    .filter(Boolean);
  const stem = (w) => (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) ? w.slice(0, -1) : w;
  const compactName = (str) => words(str).filter((w) => !ARTICLES.has(w)).map(stem).join('');
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const titleCase = (s) => s.replace(/\b[a-z]/g, (c) => c.toUpperCase());
  const rand = (min, max) => min + Math.random() * (max - min);
  const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

  function levenshtein(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length];
  }

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function loadBest(d) {
    try { const v = Number(localStorage.getItem(BEST_KEY + d)); return v > 0 ? v : null; } catch (_) { return null; }
  }
  function saveBest(d, v) {
    try { localStorage.setItem(BEST_KEY + d, String(v)); } catch (_) { /* storage unavailable */ }
  }
  function loadDifficulty() {
    try { const v = Number(localStorage.getItem(DIFF_KEY)); return v >= 1 && v <= 4 ? v : 2; } catch (_) { return 2; }
  }
  function saveDifficulty(v) {
    try { localStorage.setItem(DIFF_KEY, String(v)); } catch (_) { /* storage unavailable */ }
  }

  /* ---------- Data ---------- */
  const QUESTIONS = QUESTION_DEFS.map(([id, text, kws, tier], order) => ({
    id, text, tier, order,
    plain: words(text).join(' '),
    keywords: kws.map((k) => words(k).map(stem)).filter((k) => k.length)
  }));
  const QUESTION_BY_ID = Object.fromEntries(QUESTIONS.map((q) => [q.id, q]));

  const EMOJIS = EMOJI_DEFS.map(([char, name, aliases, yes, maybe, level, fresh], index) => {
    const yesSet = new Set(yes.split(/\s+/).filter(Boolean));
    const maybeSet = new Set(maybe.split(/\s+/).filter(Boolean));
    if (yesSet.has('legs4')) yesSet.add('legs');
    if (yesSet.has('grows') && !yesSet.has('nature')) maybeSet.add('nature');
    yesSet.forEach((t) => maybeSet.delete(t));
    const names = [name].concat(aliases ? aliases.split('|') : []);
    const keys = Array.from(new Set(names.map(compactName).filter(Boolean)));
    const nameWords = names.map((n) => words(n).filter((w) => !ARTICLES.has(w)));
    return { index, char, name, names, nameWords, keys, level, fresh: !!fresh, yes: yesSet, maybe: maybeSet };
  });

  const NAME_INDEX = new Map();
  EMOJIS.forEach((e) => e.keys.forEach((k) => { if (!NAME_INDEX.has(k)) NAME_INDEX.set(k, e.index); }));

  /* ---------- Which emojis can this device draw? ---------- */
  // Newer emojis, flags (e.g. on Windows) and ZWJ sequences may not render. Draw each one to a
  // tiny canvas and drop the ones that come out blank, as a "missing glyph" box, or un-joined.
  function detectSupport() {
    try {
      const W = 40, H = 20;
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      if (!ctx) return null;
      ctx.font = '16px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif';
      ctx.textBaseline = 'top';
      const shot = (s) => {
        ctx.clearRect(0, 0, W, H);
        ctx.fillText(s, 0, 2);
        const d = ctx.getImageData(0, 0, W, H).data;
        let h = 0;
        for (let i = 0; i < d.length; i += 4) h = (Math.imul(h, 31) + d[i] + d[i + 1] * 3 + d[i + 2] * 7 + d[i + 3] * 11) | 0;
        return h;
      };
      const blank = shot('');
      const tofu = shot('\u{10FFFD}');
      const ok = new Set();
      let checked = 0;
      EMOJIS.forEach((e) => {
        const parts = Array.from(e.char).filter((c) => c !== '\uFE0F');
        // Only newer emojis and combined sequences (flags, ZWJ) can be missing on current devices.
        if (!e.fresh && parts.length === 1) { ok.add(e.index); return; }
        checked++;
        const full = shot(e.char);
        if (full === blank || full === tofu) return;
        if (parts.length > 1 && !/\u20E3/.test(e.char) && shot(parts.join('\u200B')) === full) return;
        ok.add(e.index);
      });
      // If most emojis "fail", detection itself isn't trustworthy here — show everything.
      return EMOJIS.length - ok.size <= checked * 0.6 ? ok : null;
    } catch (_) {
      return null;
    }
  }
  const SUPPORTED = detectSupport();
  const drawable = (e) => !SUPPORTED || SUPPORTED.has(e.index);

  let difficulty = DIFFICULTIES.find((d) => d.id === loadDifficulty());
  let POOL = [];
  let inPool = new Set();
  function buildPool() {
    POOL = EMOJIS.filter((e) => e.level <= difficulty.maxLevel && drawable(e));
    inPool = new Set(POOL.map((e) => e.index));
  }
  buildPool();

  const answerFor = (emoji, qid) => emoji.yes.has(qid) ? 'Yes' : emoji.maybe.has(qid) ? 'Sometimes' : 'No';

  /* ---------- Question matching ---------- */
  function containsSeq(tokens, seq) {
    outer: for (let i = 0; i <= tokens.length - seq.length; i++) {
      for (let j = 0; j < seq.length; j++) if (tokens[i + j] !== seq[j]) continue outer;
      return true;
    }
    return false;
  }

  function rankQuestions(text, partial = false) {
    const raw = text.trim().toLowerCase().replace(/\?+$/, '');
    const allTokens = words(text).map(stem);
    const tokens = allTokens.filter((t) => !STOP_WORDS.has(t));
    const last = words(text).pop() || '';
    const typed = words(text).join(' ');
    const results = [];
    for (const q of QUESTIONS) {
      let score = typed === q.plain ? 50 : 0;
      for (const kw of q.keywords) {
        if (containsSeq(allTokens, kw) && (kw.length > 1 || tokens.includes(kw[0]))) score += kw.length;
      }
      if (partial && score === 0) {
        if (last.length >= 2 && !STOP_WORDS.has(last) && q.keywords.some((kw) => kw.length === 1 && kw[0].startsWith(last))) score += 0.5;
        if (raw.length >= 3 && q.text.toLowerCase().includes(raw)) score += 0.75;
      }
      if (score > 0) results.push({ q, score });
    }
    return results.sort((a, b) => b.score - a.score || b.q.tier - a.q.tier || a.q.order - b.q.order);
  }

  /* ---------- Emoji matching ---------- */
  const GUESS_PREFIX = /^(?:is it|is this|it is|its|it s|could it be|might it be|would it be|maybe|i think it is|i think its|i think it s|my guess is|i guess|guess|is that)\s+(.+)$/;

  function stripGuessPrefix(text) {
    const cleaned = words(text).join(' ');
    const m = cleaned.match(GUESS_PREFIX);
    return m ? m[1] : cleaned;
  }

  // Exact name/alias first, then a single close typo match. Returns -1 when unsure.
  function resolveEmoji(text) {
    const key = compactName(stripGuessPrefix(text));
    if (!key) return -1;
    if (NAME_INDEX.has(key)) return NAME_INDEX.get(key);
    const close = new Set();
    POOL.forEach((e) => e.keys.forEach((k) => {
      const allowed = k.length >= 9 ? 2 : k.length >= 5 ? 1 : 0;
      if (allowed > 0 && Math.abs(k.length - key.length) <= allowed && levenshtein(k, key) <= allowed) close.add(e.index);
    }));
    return close.size === 1 ? Array.from(close)[0] : -1;
  }

  // Every emoji in the game, matched by name or alias. score 100+ = exact.
  function searchEmojis(text, limit = 6) {
    const qWords = words(stripGuessPrefix(text)).filter((w) => !ARTICLES.has(w));
    const qc = qWords.join('');
    if (!qc) return [];
    const hits = new Map();
    POOL.forEach((e) => {
      e.nameWords.forEach((nw, ni) => {
        const n = e.names[ni];
        const nc = nw.join('');
        let score = 0;
        if (nc === qc || compactName(n) === compactName(qc)) score = 100;
        else if (nc.startsWith(qc)) score = 80;
        else if (qWords.length === 1 && nw.some((w) => w.startsWith(qc))) score = 60;
        else if (qc.length >= 3 && nc.includes(qc)) score = 40;
        else if (qc.length >= 4 && levenshtein(nc.slice(0, qc.length), qc) <= 1) score = 20;
        if (!score) return;
        if (ni === 0) score += 5;
        const prev = hits.get(e.index);
        if (!prev || prev.score < score) hits.set(e.index, { score, via: ni === 0 ? null : n });
      });
    });
    const top = Math.max(0, ...Array.from(hits.values()).map((h) => h.score));
    return Array.from(hits.entries())
      .filter(([, h]) => top < 40 || h.score >= 40) // drop fuzzy noise when real matches exist
      .sort((a, b) => b[1].score - a[1].score || EMOJIS[a[0]].name.localeCompare(EMOJIS[b[0]].name))
      .slice(0, limit)
      .map(([idx, h]) => ({ idx, score: h.score, via: h.via }));
  }

  /* ---------- Unified suggestions (questions + emojis in one list) ---------- */
  // Returns { items: [{kind:'q'|'e', id, ...}], confident: bool } — confident means Enter
  // can safely act on items[0] without the player picking it.
  function buildSuggestions(text) {
    const t = text.trim();
    if (!t) return { items: [], confident: false };
    const lower = words(t).join(' ');
    const questionish = QUESTION_START.test(lower);
    const qs = rankQuestions(t, true);
    const es = searchEmojis(t, 6);
    const qTop = qs[0];
    const eTop = es[0];
    const eExact = !!eTop && eTop.score >= 100;

    let emojiFirst;
    if (!eTop) emojiFirst = false;
    else if (!qTop) emojiFirst = true;
    else if (questionish) emojiFirst = eExact && qTop.score < 1;   // "is it a person?" stays a question
    else emojiFirst = eExact || qTop.score < 1;

    const qItems = qs.slice(0, emojiFirst ? 2 : 3).map((r) => ({ kind: 'q', id: r.q.id, score: r.score }));
    const eItems = es.slice(0, emojiFirst ? 4 : 3).map((h) => ({ kind: 'e', id: h.idx, score: h.score, via: h.via }));
    const items = emojiFirst ? eItems.concat(qItems) : qItems.concat(eItems);

    let confident = false;
    if (items.length) {
      const first = items[0];
      if (first.kind === 'q') confident = first.score >= 1;
      else confident = first.score >= 100 || es.length === 1 || resolveEmoji(t) === first.id;
    }
    return { items, confident, emojiFirst };
  }

  /* ---------- State ---------- */
  let state;
  let bank = [];
  let sugg = { items: [], confident: false };
  let active = -1;          // highlighted suggestion index
  let lastIdx = -1;
  let best = loadBest(difficulty.id);
  let giveUpTimer = null;

  function newGame() {
    let idx;
    do { idx = POOL[Math.floor(Math.random() * POOL.length)].index; } while (idx === lastIdx && POOL.length > 1);
    lastIdx = idx;
    state = {
      idx,
      log: [],
      steps: 0,
      par: difficulty.par,
      wrong: [],
      status: 'playing',
      newBest: false,
      cloudOrder: shuffled(POOL.map((e) => e.index))
    };
    input.value = '';
    setMessage('Type a question or an emoji name — or tap a question below.');
    resetGiveUp();
    closeSuggest();
    resetCloud();
    dealBank();
    render();
    input.focus();
  }

  const target = () => EMOJIS[state.idx];
  const playing = () => state.status === 'playing';
  const askedIds = () => new Set(state.log.filter((e) => e.q).map((e) => e.q));

  function candidates() {
    const answered = state.log.filter((e) => e.q);
    return POOL.filter((e) => !state.wrong.includes(e.index) && answered.every((a) => answerFor(e, a.q) === a.a));
  }

  /* ---------- Question bank ---------- */
  function entropy(cands, qid) {
    const counts = { Yes: 0, No: 0, Sometimes: 0 };
    cands.forEach((e) => { counts[answerFor(e, qid)]++; });
    const n = cands.length || 1;
    return Object.values(counts).reduce((h, c) => (c ? h - (c / n) * Math.log2(c / n) : h), 0);
  }

  function dealBank() {
    const asked = askedIds();
    const unasked = QUESTIONS.filter((q) => !asked.has(q.id));
    const cands = candidates();
    let pool = unasked
      .map((q) => ({ q, h: entropy(cands, q.id) + Math.random() * 0.05 }))
      .filter((s) => s.h > 0.06)
      .sort((a, b) => b.h - a.h)
      .slice(0, 12)
      .map((s) => s.q);
    if (pool.length < BANK_SIZE) {
      pool = pool.concat(shuffled(unasked.filter((q) => !pool.includes(q))).slice(0, BANK_SIZE - pool.length));
    }
    bank = shuffled(pool).slice(0, BANK_SIZE).map((q) => q.id);
  }

  /* ---------- Actions ---------- */
  function ask(qid) {
    if (!playing()) return;
    if (askedIds().has(qid)) {
      setMessage(`Already asked — the answer was ${state.log.find((e) => e.q === qid).a}.`);
      return;
    }
    state.steps++;
    state.log.push({ q: qid, a: answerFor(target(), qid), step: state.steps });
    afterMove();
    setMessage(parMessage());
    dealBank();
    render();
  }

  function guess(idx) {
    if (!playing()) return;
    const e = EMOJIS[idx];
    if (!inPool.has(idx)) {
      setMessage(`${e.name} isn’t in ${difficulty.label} mode${difficulty.id < 4 ? ' — try a harder level' : ''}.`);
      return;
    }
    if (state.wrong.includes(idx)) { setMessage(`You already guessed ${e.name}.`); return; }

    const t = target();
    const ok = idx === t.index;
    state.steps++;
    state.log.push({ guess: e.name, char: e.char, ok, step: state.steps });
    afterMove();

    if (ok) {
      state.status = state.steps <= state.par ? 'won' : 'solved';
      if (state.status === 'won' && (best === null || state.steps < best)) {
        best = state.steps;
        state.newBest = true;
        saveBest(difficulty.id, best);
      }
      setMessage('');
      celebrate(t.char, state.status === 'won');
    } else {
      state.wrong.push(idx);
      shake();
      setMessage(`Not ${e.name}. ${parMessage()}`.trim());
      dealBank();
    }
    render();
  }

  function giveUp() {
    if (!playing()) return;
    if (!giveUpTimer) {
      $('giveUpLabel').textContent = 'Sure? Tap again';
      $('giveUpBtn').classList.add('confirm');
      giveUpTimer = setTimeout(resetGiveUp, 2500);
      return;
    }
    resetGiveUp();
    state.status = 'gaveup';
    afterMove();
    state.freshRow = -1;
    setMessage('');
    render();
  }

  function resetGiveUp() {
    clearTimeout(giveUpTimer);
    giveUpTimer = null;
    $('giveUpLabel').textContent = 'Give up';
    $('giveUpBtn').classList.remove('confirm');
  }

  function afterMove() {
    if (pendingDiff) { pendingDiff = null; paintDifficulty(difficulty.id); }
    input.value = '';
    closeSuggest();
    resetGiveUp();
    state.freshRow = state.log.length - 1;
  }

  function parMessage() {
    const left = state.par - state.steps;
    if (left > 0) return '';
    if (left === 0) return 'Last step under par — make it count.';
    return 'Past par — keep going, but it won’t count as a win.';
  }

  function pick(item) {
    if (!item) return;
    if (item.kind === 'q') ask(item.id);
    else guess(item.id);
  }

  function submit() {
    if (!playing()) return;
    const text = input.value.trim();
    if (!text) return;
    const s = buildSuggestions(text);
    if (active >= 0 && sugg.items[active]) { pick(sugg.items[active]); return; }
    if (s.items.length && s.confident) { pick(s.items[0]); return; }
    const idx = resolveEmoji(text);
    if (idx >= 0) { guess(idx); return; }
    if (s.items.length) {
      setMessage('A few things match — pick one from the list.');
      if (suggestEl.hidden) updateSuggest();
      active = 0;
      paintActive();
    } else {
      setMessage('Couldn’t match that — try a question below or an emoji name.');
    }
  }

  /* ---------- DOM ---------- */
  const $ = (id) => document.getElementById(id);
  const input = $('input');
  const suggestEl = $('suggest');
  const cloudEl = $('cloud');
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const narrow = window.matchMedia && window.matchMedia('(max-width: 480px)');
  function setPlaceholder() {
    input.placeholder = narrow && narrow.matches ? 'Question or emoji name…' : 'Ask a question or type an emoji name…';
  }
  setPlaceholder();
  if (narrow && narrow.addEventListener) narrow.addEventListener('change', setPlaceholder);

  function setMessage(text) { $('message').textContent = text; }

  /* ---------- Difficulty ---------- */
  const diffInput = $('diff');
  let pendingDiff = null;

  function paintDifficulty(id) {
    const d = DIFFICULTIES.find((x) => x.id === id);
    const count = EMOJIS.filter((e) => e.level <= d.maxLevel && drawable(e)).length;
    diffInput.value = String(id);
    diffInput.style.setProperty('--fill', ((id - 1) / 3) * 100 + '%');
    $('diffName').textContent = d.label;
    $('diffMeta').textContent = `${count.toLocaleString()} ${d.blurb} · par ${d.par}`;
    document.querySelectorAll('#diffLabels button').forEach((b) => b.classList.toggle('on', Number(b.dataset.d) === id));
  }

  function applyDifficulty(id) {
    pendingDiff = null;
    difficulty = DIFFICULTIES.find((d) => d.id === id);
    saveDifficulty(id);
    best = loadBest(id);
    buildPool();
    paintDifficulty(id);
    newGame();
  }

  function requestDifficulty(id) {
    if (id === difficulty.id) { pendingDiff = null; paintDifficulty(id); setMessage(''); return; }
    if (!playing() || state.steps === 0) { applyDifficulty(id); return; }
    pendingDiff = id;
    paintDifficulty(id);
    const d = DIFFICULTIES.find((x) => x.id === id);
    const msg = $('message');
    msg.innerHTML = `Switch to ${d.label}? This starts a new game.<button type="button" class="link" id="diffYes">Switch</button><button type="button" class="link quiet" id="diffNo">Keep playing</button>`;
    $('diffYes').addEventListener('click', () => applyDifficulty(id));
    $('diffNo').addEventListener('click', () => { pendingDiff = null; paintDifficulty(difficulty.id); setMessage(''); input.focus(); });
  }

  diffInput.addEventListener('input', () => paintDifficulty(Number(diffInput.value)));
  diffInput.addEventListener('change', () => requestDifficulty(Number(diffInput.value)));
  document.querySelectorAll('#diffLabels button').forEach((b) => {
    b.addEventListener('click', () => requestDifficulty(Number(b.dataset.d)));
  });
  paintDifficulty(difficulty.id);

  function shake() {
    const m = $('mystery');
    m.classList.remove('shake');
    void m.offsetWidth;
    m.classList.add('shake');
  }

  /* ---------- Candidate cloud (tap an emoji to guess it) ---------- */
  const SLOTS = (() => {
    const W = 520, H = 220, TILE = 70, MIN_GAP = 52;
    const pts = [];
    let tries = 0;
    while (pts.length < CLOUD_MAX && tries < 4000) {
      tries++;
      const x = rand(24, W - 24);
      const y = rand(22, H - 22);
      const dx = (x - W / 2) / (W / 2);
      const dy = (y - H / 2) / (H / 2);
      if (Math.abs(x - W / 2) < TILE + 18 && Math.abs(y - H / 2) < TILE) continue;
      if (dx * dx + dy * dy > 1.05) continue;
      if (pts.some((p) => Math.hypot(p.x - x, p.y - y) < MIN_GAP)) continue;
      pts.push({ x, y });
    }
    return pts.map((p) => ({ left: (p.x / W) * 100, top: (p.y / H) * 100 }));
  })();

  const floats = new Map(); // emoji index -> { el, slot }

  function resetCloud() {
    floats.forEach(({ el }) => el.remove());
    floats.clear();
  }

  function renderCloud() {
    const showing = new Set();
    if (playing()) {
      const cands = new Set(candidates().map((e) => e.index));
      const order = state.cloudOrder.filter((i) => cands.has(i));
      const keep = order.filter((i) => floats.has(i));
      const fresh = order.filter((i) => !floats.has(i));
      keep.concat(fresh).slice(0, Math.min(CLOUD_MAX, SLOTS.length)).forEach((i) => showing.add(i));
    }

    floats.forEach((f, i) => {
      if (showing.has(i)) return;
      floats.delete(i);
      f.el.classList.add('out');
      f.el.tabIndex = -1;
      setTimeout(() => f.el.remove(), 550);
    });

    const used = new Set(Array.from(floats.values()).map((f) => f.slot));
    const free = shuffled(SLOTS.map((_, k) => k).filter((k) => !used.has(k)));
    showing.forEach((i) => {
      if (floats.has(i)) return;
      const slot = free.shift();
      if (slot === undefined) return;
      const e = EMOJIS[i];
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'float enter';
      el.dataset.name = e.name;
      el.setAttribute('aria-label', `Guess ${e.name}`);
      el.style.left = SLOTS[slot].left + '%';
      el.style.top = SLOTS[slot].top + '%';
      el.style.setProperty('--o', rand(0.3, 0.55).toFixed(2));
      el.style.setProperty('--s', Math.round(rand(24, 34)) + 'px');
      el.style.setProperty('--d', rand(2.8, 4.8).toFixed(2) + 's');
      el.style.setProperty('--delay', (-rand(0, 4)).toFixed(2) + 's');
      el.innerHTML = `<span class="emoji">${e.char}</span>`;
      el.addEventListener('click', () => guess(i));
      cloudEl.insertBefore(el, cloudEl.firstChild);
      floats.set(i, { el, slot });
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter')));
    });
  }

  /* ---------- Emoji shower ---------- */
  let showerCount = 0;
  let lastDrop = 0;

  function drop(char, { burst = false } = {}) {
    if (reduceMotion || showerCount >= (burst ? SHOWER_MAX + 30 : SHOWER_MAX)) return;
    const el = document.createElement('span');
    el.className = 'shower' + (burst ? ' burst' : '');
    el.textContent = char;
    el.style.left = rand(0, 100) + 'vw';
    el.style.fontSize = Math.round(burst ? rand(22, 40) : rand(14, 26)) + 'px';
    el.style.setProperty('--o', (burst ? rand(0.75, 1) : rand(0.25, 0.55)).toFixed(2));
    el.style.setProperty('--dur', (burst ? rand(1.8, 3) : rand(3, 5)).toFixed(2) + 's');
    el.style.setProperty('--drift', Math.round(rand(-60, 60)) + 'px');
    el.style.setProperty('--rot', Math.round(rand(-200, 200)) + 'deg');
    if (burst) el.style.animationDelay = rand(0, 0.6).toFixed(2) + 's';
    showerCount++;
    el.addEventListener('animationend', () => { el.remove(); showerCount--; }, { once: true });
    document.body.appendChild(el);
  }

  function sprinkle() {
    const now = performance.now();
    if (now - lastDrop < 70) return;
    lastDrop = now;
    const pool = playing() ? candidates() : POOL;
    const src = pool.length ? pool : POOL;
    drop(src[Math.floor(Math.random() * src.length)].char);
  }

  function celebrate(char, isWin) {
    const pieces = isWin ? [char, char, char, '✨', '🎉'] : [char, '✨'];
    const count = isWin ? 36 : 14;
    for (let i = 0; i < count; i++) drop(pieces[i % pieces.length], { burst: true });
  }

  /* ---------- Render ---------- */
  function render() {
    const t = target();
    const isPlaying = playing();
    const left = state.par - state.steps;

    $('steps').textContent = state.steps;
    $('par').textContent = state.par;
    $('stepPill').classList.toggle('over', state.steps > state.par);
    $('bestPill').hidden = best === null;
    $('best').textContent = best === null ? '' : best;

    const mystery = $('mystery');
    mystery.classList.toggle('win', state.status === 'won');
    mystery.classList.toggle('over', state.status === 'solved' || state.status === 'gaveup');
    mystery.innerHTML = isPlaying ? '<span class="q" aria-label="Hidden emoji">?</span>' : `<span class="emoji">${t.char}</span>`;

    const leftEl = $('left');
    leftEl.className = 'left';
    if (state.status === 'won') {
      const under = state.par - state.steps;
      leftEl.innerHTML = `<b>${escapeHtml(t.name)}</b> in ${plural(state.steps, 'step')} · <span class="gold">${under === 0 ? 'right on par' : `${under} under par`}</span>${state.newBest ? ' · new best!' : ''}`;
      leftEl.classList.add('done');
    } else if (state.status === 'solved') {
      leftEl.innerHTML = `<b>${escapeHtml(t.name)}</b> in ${plural(state.steps, 'step')} · ${state.steps - state.par} over par — no win this time`;
      leftEl.classList.add('done');
    } else if (state.status === 'gaveup') {
      leftEl.innerHTML = `It was <b>${escapeHtml(t.name)}</b> · gave up after ${plural(state.steps, 'step')}`;
      leftEl.classList.add('done');
    } else if (left >= 0) {
      leftEl.textContent = `${left} left`;
    } else {
      leftEl.textContent = `${-left} over par`;
      leftEl.classList.add('over');
    }

    renderCloud();

    const log = $('log');
    let html = '';
    state.log.forEach((e, i) => {
      if (e.step === state.par + 1) html += '<div class="par-line">par</div>';
      const cls = 'row' + (e.step > state.par ? ' past-par' : '') + (i === state.freshRow ? ' fresh' : '');
      if (e.q) {
        const a = e.a === 'Yes' ? 'yes' : e.a === 'No' ? 'no' : 'maybe';
        html += `<div class="${cls}"><span class="num">${i + 1}</span><span class="chip">ask()</span><span class="text">${escapeHtml(QUESTION_BY_ID[e.q].text)}</span><span class="ans ${a}">${e.a}</span></div>`;
      } else {
        html += `<div class="${cls}"><span class="num">${i + 1}</span><span class="chip guess">guess()</span><span class="text"><span class="emoji">${e.char}</span>${escapeHtml(e.guess)}?</span><span class="ans ${e.ok ? 'yes' : 'no'}">${e.ok ? 'Yes' : 'No'}</span></div>`;
      }
    });
    log.innerHTML = html;
    state.freshRow = -1;
    requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });

    $('field').hidden = !isPlaying;
    $('actions').hidden = !isPlaying;
    $('tips').hidden = !isPlaying;
    $('endActions').hidden = isPlaying;
    $('sendBtn').disabled = !input.value.trim();
    updateModeChip();

    const bankEl = $('bank');
    bankEl.innerHTML = '';
    if (isPlaying) {
      bank.forEach((qid, n) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tile';
        b.innerHTML = `<span class="key">${n + 1}</span>${escapeHtml(QUESTION_BY_ID[qid].text)}`;
        b.addEventListener('click', () => ask(qid));
        bankEl.appendChild(b);
      });
    }

    if (!isPlaying) $('againBtn').focus();
  }

  function updateModeChip() {
    const chip = $('modeChip');
    const item = sugg.items[active >= 0 ? active : 0];
    const mode = input.value.trim() && item ? (item.kind === 'e' ? 'guess' : 'ask') : 'idle';
    chip.dataset.mode = mode;
    chip.textContent = mode === 'guess' ? 'guess()' : 'ask()';
  }

  /* ---------- Autocomplete dropdown ---------- */
  function updateSuggest() {
    const text = input.value.trim();
    if (!playing() || !text) { closeSuggest(); updateModeChip(); return; }
    sugg = buildSuggestions(text);
    if (!sugg.items.length) {
      active = -1;
      suggestEl.innerHTML = '<div class="suggest-note">No match yet — keep typing, or try a question below.</div>';
      suggestEl.hidden = false;
      updateModeChip();
      return;
    }
    if (active >= sugg.items.length) active = -1;
    const asked = askedIds();
    let html = '';
    let lastKind = null;
    sugg.items.forEach((it, i) => {
      if (it.kind !== lastKind) {
        html += `<div class="suggest-head"><span>${it.kind === 'q' ? 'Ask' : 'Guess'}</span></div>`;
        lastKind = it.kind;
      }
      if (it.kind === 'q') {
        const prev = asked.has(it.id) ? state.log.find((e) => e.q === it.id) : null;
        html += `<button type="button" class="suggest-item${prev ? ' tried' : ''}" role="option" data-i="${i}"><span>${escapeHtml(QUESTION_BY_ID[it.id].text)}</span>${prev ? `<small>asked · ${prev.a}</small>` : ''}</button>`;
      } else {
        const e = EMOJIS[it.id];
        const tried = state.wrong.includes(it.id);
        const note = tried ? 'guessed · No' : it.via ? escapeHtml(titleCase(it.via)) : '';
        html += `<button type="button" class="suggest-item${tried ? ' tried' : ''}" role="option" data-i="${i}"><span class="opt"><span class="emoji">${e.char}</span>${escapeHtml(e.name)}</span>${note ? `<small>${note}</small>` : ''}</button>`;
      }
    });
    suggestEl.innerHTML = html;
    suggestEl.hidden = false;
    paintActive();
  }

  function paintActive() {
    const shown = active >= 0 ? active : (sugg.confident ? 0 : -1);
    suggestEl.querySelectorAll('.suggest-item').forEach((el) => {
      el.setAttribute('aria-selected', String(Number(el.dataset.i) === shown));
    });
    updateModeChip();
  }

  function closeSuggest() {
    suggestEl.hidden = true;
    suggestEl.innerHTML = '';
    sugg = { items: [], confident: false };
    active = -1;
  }

  /* ---------- Events ---------- */
  suggestEl.addEventListener('mousedown', (ev) => {
    const item = ev.target.closest('.suggest-item');
    if (!item) return;
    ev.preventDefault();
    pick(sugg.items[Number(item.dataset.i)]);
  });

  input.addEventListener('input', (ev) => {
    if (ev.inputType && ev.inputType.startsWith('insert')) sprinkle();
    active = -1;
    $('sendBtn').disabled = !input.value.trim();
    updateSuggest();
  });

  input.addEventListener('keydown', (ev) => {
    const hasItems = !suggestEl.hidden && sugg.items.length > 0;
    if (ev.key === 'Enter') {
      ev.preventDefault();
      submit();
    } else if (!input.value && /^[1-6]$/.test(ev.key) && bank[Number(ev.key) - 1]) {
      ev.preventDefault();
      ask(bank[Number(ev.key) - 1]);
    } else if ((ev.key === 'ArrowDown' || (ev.key === 'Tab' && !ev.shiftKey)) && hasItems) {
      ev.preventDefault();
      active = (active + 1) % sugg.items.length;
      paintActive();
    } else if ((ev.key === 'ArrowUp' || (ev.key === 'Tab' && ev.shiftKey)) && hasItems) {
      ev.preventDefault();
      active = active <= 0 ? sugg.items.length - 1 : active - 1;
      paintActive();
    } else if (ev.key === 'Escape') {
      ev.preventDefault();
      if (!suggestEl.hidden) closeSuggest();
      else input.value = '';
      $('sendBtn').disabled = !input.value.trim();
      updateModeChip();
    }
  });

  input.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== input) closeSuggest(); }, 120));
  input.addEventListener('focus', updateSuggest);

  $('sendBtn').addEventListener('mousedown', (ev) => ev.preventDefault()); // keep focus + dropdown
  $('sendBtn').addEventListener('click', () => { submit(); input.focus(); });
  $('shuffleBtn').addEventListener('click', () => { dealBank(); render(); input.focus(); });
  $('giveUpBtn').addEventListener('click', giveUp);
  $('againBtn').addEventListener('click', newGame);

  document.addEventListener('keydown', (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (!playing()) {
      if (ev.key === 'Enter' || ev.key === 'n' || ev.key === 'N') {
        ev.preventDefault();
        newGame();
      }
      return;
    }
    if (document.activeElement === input) return;
    if (/^[1-6]$/.test(ev.key) && bank[Number(ev.key) - 1] && !(document.activeElement && document.activeElement.tagName === 'INPUT')) {
      ev.preventDefault();
      ask(bank[Number(ev.key) - 1]);
      return;
    }
    if (ev.key === '/' || (ev.key.length === 1 && /\S/.test(ev.key))) {
      if (ev.key === '/') ev.preventDefault();
      input.focus();
    }
  });

  newGame();
})();
</script>
</body>
</html>
