<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#09090b">
<title>Guess the Emoji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090b;
    --bg-glow: #131318;
    --surface: #111114;
    --tile: #1a1a1f;
    --tile-hover: #24242b;
    --border: rgba(255, 255, 255, 0.06);
    --border-strong: rgba(255, 255, 255, 0.11);
    --text: #ececf1;
    --muted: #8a8a96;
    --dim: #5c5c66;
    --accent: #e8a33d;
    --accent-hover: #f0b458;
    --accent-ink: #120c03;
    --accent-soft: rgba(232, 163, 61, 0.14);
    --accent-disabled: rgba(232, 163, 61, 0.16);
    --accent-disabled-ink: rgba(236, 236, 241, 0.32);
    --yes: #4ade80;
    --no: #f87171;
    --maybe: #fbbf24;
    --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: radial-gradient(1100px 620px at 50% -12%, var(--bg-glow), var(--bg) 70%) fixed, var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .emoji { font-family: var(--font-emoji); font-weight: 400; line-height: 1; }

  /* ---------- Game shell ---------- */
  .game {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .bar h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.035em;
  }
  .bar h1 span { color: var(--accent); }
  .meta { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--muted); font-weight: 500; }
  .dots { display: flex; gap: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text); transition: background .25s, transform .25s; }
  .dot.lost { background: #2a2a31; transform: scale(.8); }
  .meta .count { font-family: var(--font-mono); color: var(--text); font-weight: 700; }

  /* ---------- Mystery ---------- */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0 0; }
  .mystery {
    position: relative;
    width: 108px; height: 108px;
    border-radius: 26px;
    background: var(--tile);
    box-shadow: inset 0 0 0 1px var(--border-strong), 0 20px 50px -20px rgba(0, 0, 0, 0.9);
    display: grid; place-items: center;
    overflow: hidden;
  }
  .mystery::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.06) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: shimmer 3.4s ease-in-out infinite;
    pointer-events: none;
  }
  .mystery .q { font-size: 52px; font-weight: 900; color: #34343c; }
  .mystery .emoji { font-size: 62px; animation: pop .55s cubic-bezier(.2, 1.4, .4, 1); }
  .mystery.won { box-shadow: inset 0 0 0 2px var(--accent), 0 0 60px -12px rgba(232, 163, 61, 0.45); }
  .mystery.lost { box-shadow: inset 0 0 0 2px var(--no), 0 0 60px -16px rgba(248, 113, 113, 0.4); }
  .mystery.won::after, .mystery.lost::after { display: none; }
  .mystery.shake { animation: shake .42s ease; }
  .caption { margin: 0; font-size: 14px; color: var(--muted); font-weight: 500; text-align: center; }
  .caption b { color: var(--text); font-weight: 800; }

  /* ---------- Log ---------- */
  .log {
    display: flex; flex-direction: column; gap: 2px;
    max-height: 250px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #2a2a31 transparent;
  }
  .log:empty { display: none; }
  .row {
    display: grid;
    grid-template-columns: 20px auto 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 14px;
    animation: rowIn .22s ease;
  }
  .row:nth-child(odd) { background: rgba(255, 255, 255, 0.022); }
  .num { font-family: var(--font-mono); font-size: 11.5px; color: var(--dim); text-align: right; }
  .chip {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 6px;
    white-space: nowrap;
  }
  .chip.guess { color: var(--accent); }
  .text { font-weight: 600; overflow-wrap: anywhere; }
  .text .emoji { margin-right: 6px; font-size: 15px; }
  .ans { font-weight: 800; font-size: 13px; white-space: nowrap; }
  .ans.yes { color: var(--yes); }
  .ans.no { color: var(--no); }
  .ans.maybe { color: var(--maybe); }

  /* ---------- Input ---------- */
  .field { position: relative; }
  .input-box {
    display: flex; align-items: center; gap: 10px;
    height: 54px;
    padding: 0 8px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    transition: border-color .15s, box-shadow .15s;
  }
  .input-box:focus-within { border-color: rgba(232, 163, 61, 0.5); box-shadow: 0 0 0 3px rgba(232, 163, 61, 0.1); }
  .mode {
    font-family: var(--font-mono);
    font-size: 13px; font-weight: 700;
    padding: 7px 10px;
    border-radius: 10px;
    background: var(--tile);
    color: var(--muted);
    white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .mode:hover:not(:disabled) { background: var(--tile-hover); }
  .mode[data-mode="guess"] { color: var(--accent); background: var(--accent-soft); }
  .input-box input {
    flex: 1; min-width: 0; height: 100%;
    background: transparent; border: 0; outline: 0;
    color: var(--text);
    font: 600 16px var(--font-sans);
  }
  .input-box input::placeholder { color: var(--dim); font-weight: 500; }

  .suggest {
    position: absolute;
    left: 0; right: 0; bottom: calc(100% + 8px);
    display: flex; flex-direction: column; gap: 2px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    z-index: 5;
  }
  .suggest[hidden] { display: none; }
  .suggest-note { font-size: 11px; color: var(--dim); padding: 4px 10px 2px; font-weight: 500; }
  .suggest-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    text-align: left;
    font-size: 14.5px; font-weight: 600;
  }
  .suggest-item:hover, .suggest-item[aria-selected="true"] { background: var(--tile); }
  .suggest-item small { color: var(--dim); font-size: 12px; font-weight: 500; white-space: nowrap; }

  .message { min-height: 18px; margin: -10px 0 -6px; font-size: 13px; color: var(--muted); text-align: center; font-weight: 500; }

  /* ---------- Buttons ---------- */
  .actions { display: flex; gap: 10px; }
  .btn {
    flex: 1 1 0;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 46px;
    padding: 0 14px;
    border-radius: 999px;
    background: var(--tile);
    font-size: 15px; font-weight: 700; letter-spacing: -0.01em;
    white-space: nowrap;
    transition: background .15s, transform .08s;
  }
  .btn:hover:not(:disabled) { background: var(--tile-hover); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .4; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn.primary:disabled { background: var(--accent-disabled); color: var(--accent-disabled-ink); opacity: 1; }
  .btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Question bank ---------- */
  .bank { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .bank:empty { display: none; }
  .tile {
    min-height: 60px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--tile);
    box-shadow: inset 0 0 0 1px var(--border);
    font-size: 13.5px; font-weight: 700;
    line-height: 1.25;
    text-align: center;
    transition: background .15s, transform .12s, box-shadow .15s;
  }
  .tile:hover { background: var(--tile-hover); transform: translateY(-2px); }
  .tile.selected { box-shadow: inset 0 0 0 2px var(--accent); background: var(--surface); }

  [hidden] { display: none !important; }

  @keyframes shimmer { 0%, 30% { transform: translateX(-100%); } 70%, 100% { transform: translateX(100%); } }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
  }
  @keyframes rowIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  @media (max-width: 480px) {
    body { place-items: start center; padding-top: 20px; }
    .bank { grid-template-columns: repeat(2, 1fr); }
    .row { grid-template-columns: 16px auto 1fr auto; gap: 8px; padding: 7px 8px; font-size: 13.5px; }
    .log { max-height: 210px; }
    .btn { font-size: 14px; padding: 0 10px; }
    .meta .label { display: none; }
  }
</style>
</head>
<body>

<main class="game">
  <div class="bar">
    <h1>Guess the <span>Emoji</span></h1>
    <div class="meta">
      <span class="dots" id="lives" aria-label="Lives"></span>
      <span><span class="count" id="qLeft">20</span> <span class="label">questions</span> left</span>
    </div>
  </div>

  <section class="stage">
    <div class="mystery" id="mystery" aria-live="polite"><span class="q">?</span></div>
    <p class="caption" id="caption">Ask yes/no questions, then guess the emoji.</p>
  </section>

  <div class="log" id="log" aria-live="polite"></div>

  <div class="field" id="field">
    <div class="suggest" id="suggest" role="listbox" hidden></div>
    <div class="input-box">
      <button class="mode" id="modeChip" data-mode="ask" aria-label="Switch between ask and guess">ask()</button>
      <input id="input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80" placeholder="Ask a yes/no question…" aria-label="Question or guess">
    </div>
  </div>

  <p class="message" id="message" aria-live="polite"></p>

  <div class="actions" id="actions">
    <button class="btn" id="shuffleBtn">
      <svg viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
      Shuffle
    </button>
    <button class="btn" id="modeBtn">
      <svg viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
      <span id="modeBtnLabel">Guess</span>
    </button>
    <button class="btn primary" id="submitBtn" disabled>Submit</button>
  </div>

  <div class="actions" id="endActions" hidden>
    <button class="btn primary" id="againBtn">Play again</button>
  </div>

  <div class="bank" id="bank"></div>
</main>

    ['⚓', 'Anchor', '', 'object metal aquatic', 'big black'],
    ['🪁', 'Kite', '', 'object flies sky sport', 'red']
  ];

  /* ---------- Text helpers ---------- */
  const STOP_WORDS = new Set([
    'is', 'it', 'a', 'an', 'the', 'does', 'do', 'did', 'can', 'could', 'would', 'will', 'you', 'your', 'its', 'of',
    'or', 'and', 'be', 'are', 'was', 'this', 'that', 'to', 'for', 'usually', 'mostly', 'something', 'thing',
    'kind', 'type', 'sort', 'really', 'very', 'typically', 'often', 'commonly', 'ever', 'made', 'used', 'with',
    'have', 'has', 'at', 'by', 'mainly', 'generally', 'normally', 'any', 'some', 'there', 'what', 'maybe',
    'mystery', 'emoji', 'probably', 'kinda', 'sorta', 'like', 'one', 'i', 'me', 'my', 'we', 'find', 'found', 'use'
  ]);
  const ARTICLES = new Set(['a', 'an', 'the', 'some']);

  const words = (str) => String(str)
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[’']/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim()
    .split(' ')
    .filter(Boolean);
  const stem = (w) => (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) ? w.slice(0, -1) : w;
  const compactName = (str) => words(str).filter((w) => !ARTICLES.has(w)).map(stem).join('');
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const titleCase = (s) => s.replace(/\b[a-z]/g, (c) => c.toUpperCase());

  function levenshtein(a, b) {
    if (a === b) return 0;
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length];
  }

  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ---------- Data ---------- */
  const QUESTIONS = QUESTION_DEFS.map(([id, text, kws, tier], order) => ({
    id, text, tier, order,
    keywords: kws.map((k) => words(k).map(stem)).filter((k) => k.length)
  }));
  const QUESTION_BY_ID = Object.fromEntries(QUESTIONS.map((q) => [q.id, q]));

  const EMOJIS = EMOJI_DEFS.map(([char, name, aliases, yes, maybe], index) => {
    const yesSet = new Set(yes.split(/\s+/).filter(Boolean));
    const maybeSet = new Set(maybe.split(/\s+/).filter(Boolean));
    if (yesSet.has('legs4')) yesSet.add('legs');
    if (yesSet.has('grows') && !yesSet.has('nature')) maybeSet.add('nature');
    yesSet.forEach((t) => maybeSet.delete(t));
    const names = [name].concat(aliases ? aliases.split('|') : []);
    const keys = Array.from(new Set(names.map(compactName).filter(Boolean)));
    return { index, char, name, keys, yes: yesSet, maybe: maybeSet };
  });

  const NAME_INDEX = new Map();
  EMOJIS.forEach((e) => e.keys.forEach((k) => { if (!NAME_INDEX.has(k)) NAME_INDEX.set(k, e.index); }));

  const answerFor = (emoji, qid) => emoji.yes.has(qid) ? 'Yes' : emoji.maybe.has(qid) ? 'Sometimes' : 'No';

  /* ---------- Question matching ---------- */
  function containsSeq(tokens, seq) {
    outer: for (let i = 0; i <= tokens.length - seq.length; i++) {
      for (let j = 0; j < seq.length; j++) if (tokens[i + j] !== seq[j]) continue outer;
      return true;
    }
    return false;
  }

  function rankQuestions(text, partial = false) {
    const raw = text.trim().toLowerCase().replace(/\?+$/, '');
    const allTokens = words(text).map(stem);
    const tokens = allTokens.filter((t) => !STOP_WORDS.has(t));
    const last = words(text).pop() || '';
    const results = [];
    for (const q of QUESTIONS) {
      let score = 0;
      for (const kw of q.keywords) {
        if (containsSeq(allTokens, kw) && (kw.length > 1 || tokens.includes(kw[0]))) score += kw.length;
      }
      if (partial && score === 0) {
        if (last.length >= 2 && !STOP_WORDS.has(last) && q.keywords.some((kw) => kw.length === 1 && kw[0].startsWith(last))) score += 0.5;
        if (raw.length >= 3 && q.text.toLowerCase().includes(raw)) score += 0.75;
      }
      if (score > 0) results.push({ q, score });
    }
    return results.sort((a, b) => b.score - a.score || b.q.tier - a.q.tier || a.q.order - b.q.order);
  }

  const GUESS_PREFIX = /^(?:is it|is this|it is|its|it s|could it be|might it be|would it be|maybe|i think it is|i think its|i think it s|my guess is|i guess|guess|is that)\s+(.+)$/;

  function stripGuessPrefix(text) {
    const cleaned = words(text).join(' ');
    const m = cleaned.match(GUESS_PREFIX);
    return m ? m[1] : cleaned;
  }

  function detectGuess(text) {
    const cleaned = words(text).join(' ');
    const m = cleaned.match(GUESS_PREFIX);
    if (m && NAME_INDEX.has(compactName(m[1]))) return m[1];
    if (NAME_INDEX.has(compactName(cleaned))) return cleaned;
    return null;
  }

  function isCorrectGuess(target, text) {
    const key = compactName(text);
    if (!key) return false;
    if (target.keys.includes(key)) return true;
    if (NAME_INDEX.has(key) && NAME_INDEX.get(key) !== target.index) return false;
    return target.keys.some((k) => {
      const allowed = k.length >= 9 ? 2 : k.length >= 5 ? 1 : 0;
      return allowed > 0 && Math.abs(k.length - key.length) <= allowed && levenshtein(k, key) <= allowed;
    });
  }

  /* ---------- State ---------- */
  let state;
  let bank = [];
  let selected = null;
  let suggestIds = [];
  let suggestActive = -1;
  let lastIdx = -1;

  function newGame() {
    let idx;
    do { idx = Math.floor(Math.random() * EMOJIS.length); } while (idx === lastIdx && EMOJIS.length > 1);
    lastIdx = idx;
    state = { idx, log: [], lives: MAX_LIVES, used: 0, wrong: [], status: 'playing', mode: 'ask' };
    input.value = '';
    selected = null;
    setMessage('');
    closeSuggest();
    dealBank();
    render();
    input.focus();
  }

  const target = () => EMOJIS[state.idx];
  const playing = () => state.status === 'playing';
  const askedIds = () => new Set(state.log.filter((e) => e.q).map((e) => e.q));

  /* ---------- Question bank ---------- */
  function candidates() {
    const answered = state.log.filter((e) => e.q);
    const wrong = new Set(state.wrong);
    return EMOJIS.filter((e) => !e.keys.some((k) => wrong.has(k)) && answered.every((a) => answerFor(e, a.q) === a.a));
  }

  function entropy(cands, qid) {
    const counts = { Yes: 0, No: 0, Sometimes: 0 };
    cands.forEach((e) => { counts[answerFor(e, qid)]++; });
    const n = cands.length || 1;
    return Object.values(counts).reduce((h, c) => (c ? h - (c / n) * Math.log2(c / n) : h), 0);
  }

  function dealBank() {
    const asked = askedIds();
    const unasked = QUESTIONS.filter((q) => !asked.has(q.id));
    const cands = candidates();
    let pool = unasked
      .map((q) => ({ q, h: entropy(cands, q.id) + Math.random() * 0.05 }))
      .filter((s) => s.h > 0.06)
      .sort((a, b) => b.h - a.h)
      .slice(0, 12)
      .map((s) => s.q);
    if (pool.length < BANK_SIZE) {
      pool = pool.concat(shuffled(unasked.filter((q) => !pool.includes(q))).slice(0, BANK_SIZE - pool.length));
    }
    bank = shuffled(pool).slice(0, BANK_SIZE).map((q) => q.id);
    selected = null;
  }

  /* ---------- Actions ---------- */
  function ask(qid) {
    if (!playing()) return;
    if (askedIds().has(qid)) {
      setMessage(`Already asked — the answer was ${state.log.find((e) => e.q === qid).a}.`);
      return;
    }
    if (state.used >= MAX_QUESTIONS) {
      setMessage('No questions left — make your guess.');
      setMode('guess');
      return;
    }
    state.log.push({ q: qid, a: answerFor(target(), qid) });
    state.used++;
    input.value = '';
    closeSuggest();
    if (state.used >= MAX_QUESTIONS) {
      state.mode = 'guess';
      setMessage('That was your last question — time to guess.');
    } else {
      setMessage('');
    }
    dealBank();
    render();
  }

  function guess(text) {
    if (!playing()) return;
    const cleaned = stripGuessPrefix(text);
    const key = compactName(cleaned);
    if (!key) { setMessage('Type the name of an emoji.'); return; }
    if (state.wrong.includes(key)) { setMessage('You already guessed that.'); return; }

    const t = target();
    const ok = isCorrectGuess(t, cleaned);
    const known = NAME_INDEX.has(key) ? EMOJIS[NAME_INDEX.get(key)] : null;
    state.log.push({
      guess: ok ? t.name : known ? known.name : titleCase(cleaned),
      char: ok ? t.char : known ? known.char : '',
      ok
    });
    input.value = '';
    closeSuggest();

    if (ok) {
      state.status = 'won';
      setMessage('');
    } else {
      state.wrong.push(key);
      state.lives--;
      shake();
      if (state.lives <= 0) {
        state.status = 'lost';
        setMessage('');
      } else {
        setMessage(state.lives === 1 ? 'Nope — last life.' : `Nope — ${state.lives} lives left.`);
        dealBank();
      }
    }
    render();
  }

  function submit() {
    if (!playing()) return;
    const text = input.value.trim();
    if (!text) return;

    if (state.mode === 'guess') {
      const questionLike = /\?\s*$/.test(text) && !NAME_INDEX.has(compactName(stripGuessPrefix(text)));
      const ranked = questionLike ? rankQuestions(text) : [];
      if (ranked.length && ranked[0].score >= 1) {
        setMessage('That looks like a question — switch to ask().');
        return;
      }
      guess(text);
      return;
    }

    if (suggestActive >= 0 && suggestIds[suggestActive]) { ask(suggestIds[suggestActive]); return; }

    const g = detectGuess(text);
    if (g) { guess(g); return; }

    const ranked = rankQuestions(text);
    if (ranked.length && ranked[0].score >= 1) ask(ranked[0].q.id);
    else setMessage('I can’t answer that one — try a question from the bank.');
  }

  function setMode(mode) {
    if (!playing()) return;
    if (mode === 'ask' && state.used >= MAX_QUESTIONS) {
      setMessage('No questions left — make your guess.');
      mode = 'guess';
    }
    state.mode = mode;
    selected = null;
    closeSuggest();
    render();
    input.focus();
  }

  function pickTile(qid) {
    if (!playing()) return;
    if (selected === qid) { ask(qid); return; }
    selected = qid;
    input.value = QUESTION_BY_ID[qid].text;
    closeSuggest();
    render();
  }

  /* ---------- DOM ---------- */
  const $ = (id) => document.getElementById(id);
  const input = $('input');
  const suggestEl = $('suggest');

  function setMessage(text) { $('message').textContent = text; }

  function shake() {
    const m = $('mystery');
    m.classList.remove('shake');
    void m.offsetWidth;
    m.classList.add('shake');
  }

  function render() {
    const t = target();
    const active = playing();

    // Lives + counter
    $('lives').innerHTML = Array.from({ length: MAX_LIVES }, (_, i) => `<span class="dot${i >= state.lives ? ' lost' : ''}"></span>`).join('');
    $('lives').setAttribute('aria-label', `${state.lives} of ${MAX_LIVES} lives left`);
    $('qLeft').textContent = MAX_QUESTIONS - state.used;

    // Mystery tile + caption
    const mystery = $('mystery');
    mystery.classList.toggle('won', state.status === 'won');
    mystery.classList.toggle('lost', state.status === 'lost');
    mystery.innerHTML = active ? '<span class="q" aria-label="Hidden emoji">?</span>' : `<span class="emoji">${t.char}</span>`;
    const caption = $('caption');
    if (state.status === 'won') {
      caption.innerHTML = `It was <b>${escapeHtml(t.name)}</b> — solved in ${state.used} question${state.used === 1 ? '' : 's'}.`;
    } else if (state.status === 'lost') {
      caption.innerHTML = `Out of lives. It was <b>${escapeHtml(t.name)}</b>.`;
    } else if (!state.log.length) {
      caption.textContent = 'Ask yes/no questions, then guess the emoji.';
    } else {
      caption.textContent = state.used >= MAX_QUESTIONS ? 'No questions left — make your guess.' : 'What’s the emoji?';
    }

    // Log
    const log = $('log');
    log.innerHTML = state.log.map((e, i) => {
      if (e.q) {
        const cls = e.a === 'Yes' ? 'yes' : e.a === 'No' ? 'no' : 'maybe';
        return `<div class="row"><span class="num">${i + 1}</span><span class="chip">ask()</span><span class="text">${escapeHtml(QUESTION_BY_ID[e.q].text)}</span><span class="ans ${cls}">${e.a}</span></div>`;
      }
      const icon = e.char ? `<span class="emoji">${e.char}</span>` : '';
      return `<div class="row"><span class="num">${i + 1}</span><span class="chip guess">guess()</span><span class="text">${icon}${escapeHtml(e.guess)}?</span><span class="ans ${e.ok ? 'yes' : 'no'}">${e.ok ? 'Yes' : 'No'}</span></div>`;
    }).join('');
    requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });

    // Input + buttons
    $('field').hidden = !active;
    $('actions').hidden = !active;
    $('endActions').hidden = active;
    const chip = $('modeChip');
    chip.dataset.mode = state.mode;
    chip.textContent = state.mode === 'ask' ? 'ask()' : 'guess()';
    input.placeholder = state.mode === 'ask' ? 'Ask a yes/no question…' : 'Name the emoji…';
    $('modeBtnLabel').textContent = state.mode === 'ask' ? 'Guess' : 'Ask';
    $('shuffleBtn').disabled = state.mode === 'guess' || state.used >= MAX_QUESTIONS;
    $('submitBtn').disabled = !input.value.trim();

    // Bank
    const bankEl = $('bank');
    bankEl.innerHTML = '';
    if (active && state.mode === 'ask' && state.used < MAX_QUESTIONS) {
      bank.forEach((qid) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tile' + (selected === qid ? ' selected' : '');
        b.textContent = QUESTION_BY_ID[qid].text;
        b.addEventListener('click', () => pickTile(qid));
        bankEl.appendChild(b);
      });
    }

    if (!active) $('againBtn').focus();
  }

  /* ---------- Autocomplete ---------- */
  function updateSuggest() {
    const text = input.value.trim();
    if (!playing() || state.mode !== 'ask' || !text || selected) { closeSuggest(); return; }
    if (detectGuess(text)) {
      suggestIds = [];
      suggestActive = -1;
      suggestEl.innerHTML = '<div class="suggest-note">This counts as a guess() — press Enter to guess.</div>';
      suggestEl.hidden = false;
      return;
    }
    const ranked = rankQuestions(text, true).slice(0, 4);
    if (!ranked.length) { closeSuggest(); return; }
    const asked = askedIds();
    suggestIds = ranked.map((r) => r.q.id);
    if (suggestActive >= suggestIds.length) suggestActive = -1;
    suggestEl.innerHTML = ranked.map((r, i) => {
      const prev = asked.has(r.q.id) ? state.log.find((e) => e.q === r.q.id) : null;
      return `<button type="button" class="suggest-item" role="option" data-i="${i}" aria-selected="${i === suggestActive}"><span>${escapeHtml(r.q.text)}</span>${prev ? `<small>asked · ${prev.a}</small>` : ''}</button>`;
    }).join('');
    suggestEl.hidden = false;
  }

  function closeSuggest() {
    suggestEl.hidden = true;
    suggestEl.innerHTML = '';
    suggestIds = [];
    suggestActive = -1;
  }

  /* ---------- Events ---------- */
  suggestEl.addEventListener('mousedown', (ev) => {
    const item = ev.target.closest('.suggest-item');
    if (!item) return;
    ev.preventDefault();
    const qid = suggestIds[Number(item.dataset.i)];
    if (qid) ask(qid);
  });

  input.addEventListener('input', () => {
    if (selected && input.value !== QUESTION_BY_ID[selected].text) {
      selected = null;
      render();
    }
    suggestActive = -1;
    $('submitBtn').disabled = !input.value.trim();
    updateSuggest();
  });

  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      submit();
    } else if (ev.key === 'ArrowDown' && suggestIds.length) {
      ev.preventDefault();
      suggestActive = (suggestActive + 1) % suggestIds.length;
      updateSuggest();
    } else if (ev.key === 'ArrowUp' && suggestIds.length) {
      ev.preventDefault();
      suggestActive = suggestActive <= 0 ? suggestIds.length - 1 : suggestActive - 1;
      updateSuggest();
    } else if (ev.key === 'Escape') {
      if (!suggestEl.hidden) closeSuggest();
      else { input.value = ''; selected = null; render(); }
    }
  });

  input.addEventListener('blur', () => setTimeout(closeSuggest, 120));
  input.addEventListener('focus', updateSuggest);

  $('modeChip').addEventListener('click', () => setMode(state.mode === 'ask' ? 'guess' : 'ask'));
  $('modeBtn').addEventListener('click', () => setMode(state.mode === 'ask' ? 'guess' : 'ask'));
  $('shuffleBtn').addEventListener('click', () => { dealBank(); render(); });
  $('submitBtn').addEventListener('click', submit);
  $('againBtn').addEventListener('click', newGame);

  document.addEventListener('keydown', (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey || document.activeElement === input || !playing()) return;
    if (ev.key.length === 1 && /\S/.test(ev.key)) input.focus();
  });

  newGame();
})();
</script>
</body>
</html>
